<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#042f2e" media="(prefers-color-scheme: dark)" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/icons/icon-512x512.png" />

    <!-- Web App / PWA Capabilities -->
    <meta name="application-name" content="LocalMart" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LocalMart" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0d9488" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- SEO & Social Meta -->
    <title>LocalMart – Local Inventory & Price Comparison</title>
    <meta name="description" content="Search real-time store inventory, compare nearby prices, and discover products from shops around your neighborhood." />
    <meta name="keywords" content="local shopping, price comparison, nearby shops, store inventory, hyperlocal" />
    <meta property="og:title" content="LocalMart – Hyperlocal Marketplace" />
    <meta property="og:description" content="Find the best prices for products from verified stores near you." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512x512.png" />
  </head>
  <body class="bg-slate-50 antialiased selection:bg-teal-100 selection:text-teal-900">
    <noscript>Please enable JavaScript to run LocalMart.</noscript>
    <div id="root"></div>
  </body>
</html>
